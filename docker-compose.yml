services:
  api:
    build: .
    ports:
      - "8000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=safedeal;Username=safedeal;Password=secret
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=SafeDeal_Super_Secret_Key_Min_32_Chars!!
      - Jwt__Issuer=SafeDeal
      - Jwt__Audience=SafeDeal
      - Stripe__SecretKey=sk_test_VOTRE_CLE_SECRETE
      - Stripe__WebhookSecret=whsec_VOTRE_SECRET
      - Stripe__SuccessUrl=http://localhost:5173/payment/success
      - Stripe__CancelUrl=http://localhost:5173/payment/cancel
      - Sumsub__WebhookSecret=sumsub_secret
      - Email__Host=smtp.gmail.com
      - Email__Port=587
      - Email__From=merabtiasmae3@gmail.com
      - Email__Password=ssgaurjkqngzkmco
      - Cors__AllowedOrigins=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safedeal
      POSTGRES_USER: safedeal
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safedeal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads: