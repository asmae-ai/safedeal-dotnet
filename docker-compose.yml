services:
  api:
    build: .
    ports:
      - "8001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=safedeal;Username=safedeal;Password=secret
      - ConnectionStrings__Redis=redis:6379
      # Aucun secret en dur ici : ce fichier est versionne.
      # Renseigner les valeurs dans un .env local (voir .env.example).
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=SafeDeal
      - Jwt__Audience=SafeDeal
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET}
      - Frontend__BaseUrl=${FRONTEND_BASE_URL:-http://localhost:5173}
      - Sumsub__AppToken=${SUMSUB_APP_TOKEN}
      - Sumsub__SecretKey=${SUMSUB_SECRET_KEY}
      - Sumsub__WebhookSecret=${SUMSUB_WEBHOOK_SECRET}
      - Email__Host=${EMAIL_HOST:-smtp.gmail.com}
      - Email__Port=${EMAIL_PORT:-587}
      - Email__From=${EMAIL_FROM}
      - Email__Password=${EMAIL_PASSWORD}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safedeal
      POSTGRES_USER: safedeal
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safedeal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads: